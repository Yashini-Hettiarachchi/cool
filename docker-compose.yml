# Local development stack for the AC Service Hub.
# Groups MySQL + Adminer under one Compose project ("ac-service-hub")
# so they appear nested together in Docker Desktop.
#
#   docker compose up -d       # start
#   docker compose down        # stop (keeps data)
#   docker compose down -v     # stop and wipe the database volume
name: ac-service-hub

services:
  mysql:
    image: mysql:8
    container_name: ac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ac_service_system
    ports:
      - "3306:3306"
    volumes:
      - ac-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    container_name: ac-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  ac-mysql-data:
